[project]
name = "soap-tui"
dynamic = ["version"]
description = "soap — a reference manager (CLI + TUI)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Ghifari Arsa" }]
keywords = ["reference-manager", "bibliography", "cli", "tui"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/GhifariArsa/soap"
Repository = "https://github.com/GhifariArsa/soap"

[project.scripts]
soap = "soap.main:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "soap/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["soap"]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0,<3",
    "pytest>=9.1.1",
    "ruff>=0.11.0,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F401", "F541"]
